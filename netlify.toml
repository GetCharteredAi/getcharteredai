[build]
  base = "."
  publish = "public"
  functions = "netlify/functions"

# TEST SCAFFOLD — DELETE BEFORE MERGE TO MAIN
# Forces test prefix on all non-production deploys so Phase 4 test sessions
# cannot write to production Blobs stores.
# P1_SITE_URL overrides the production URL so background function calls
# self-reference the branch deploy (Netlify does not inject DEPLOY_URL at runtime).
[context.deploy-preview.environment]
  P1_STORE_PREFIX = "test"

[context.branch-deploy.environment]
  P1_STORE_PREFIX = "test"
  P1_SITE_URL = "https://feature-p1-phase4-progress-reflection--getcharteredai.netlify.app"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = false

[[redirects]]
  from = "/employer-guide.html"
  to = "/employer"
  status = 301

[[redirects]]
  from = "/employer"
  to = "/employer.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html?view=dashboard"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/cancel"
  to = "/cancel.html"
  status = 200

[[redirects]]
  from = "/sprint-success"
  to = "/sprint-success.html"
  status = 200

[[redirects]]
  from = "/apprentice-review"
  to = "/apprentice-review.html"
  status = 200

[[redirects]]
  from = "/year-one-review"
  to = "/year-two-review"
  status = 301

[[redirects]]
  from = "/year-two-review"
  to = "/year-two-review.html"
  status = 200

[[redirects]]
  from = "/sprint"
  to = "/sprint.html"
  status = 200

[[redirects]]
  from = "/referred-programme"
  to = "/referred-programme.html"
  status = 200

[[redirects]]
  from = "/employer-guide"
  to = "/employer-guide.html"
  status = 200

[[redirects]]
  from = "/which-programme"
  to = "/which-programme.html"
  status = 200

[[redirects]]
  from = "/programme"
  to = "/programme.html"
  status = 200

[[redirects]]
  from = "/professional-readiness-benchmark"
  to = "/professional-readiness-benchmark.html"
  status = 200

[functions."p1-scheduled"]
  schedule = "@daily"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
