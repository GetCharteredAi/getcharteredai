<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Readiness Overview | Get Chartered AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D0F1C;--blue:#2563EB;--amber:#f59e0b;--green:#10b981;
  --muted:#64748b;--border:#e2e8f0;--bg:#f8fafc;--white:#fff;
  --fh:'Plus Jakarta Sans',sans-serif;--f:'Inter',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--navy);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Nav */
nav{position:sticky;top:0;z-index:100;background:rgba(11,12,28,.97);backdrop-filter:blur(16px);height:64px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(255,255,255,.06)}
.nav-brand{font-family:var(--fh);font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
.nav-brand span{color:var(--amber)}
.nav-label{margin-left:auto;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase}

/* States */
.state-wrap{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-family:var(--fh);font-size:22px;font-weight:700;color:var(--navy)}
.state-body{font-size:15px;color:var(--muted);max-width:440px;line-height:1.7}
.state-link{font-size:14px;color:var(--blue);text-decoration:underline;margin-top:4px}

/* Refresh banner */
.refresh-banner{background:#fffbeb;border-bottom:1.5px solid #fcd34d;padding:10px 40px;display:flex;align-items:center;gap:10px;font-size:13px;color:#92400e}
.refresh-dot{width:8px;height:8px;background:var(--amber);border-radius:50%;animation:rpulse 1.4s ease-in-out infinite}
@keyframes rpulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Hero */
.hero{background:var(--white);padding:64px 40px 56px;border-bottom:1px solid var(--border)}
.hero-inner{max-width:800px;margin:0 auto}
.hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;display:block}
.hero-title{font-family:var(--fh);font-size:clamp(24px,3.5vw,36px);font-weight:800;letter-spacing:-.02em;color:var(--navy);margin-bottom:6px;line-height:1.15}
.hero-firm{font-size:15px;color:var(--muted);margin-bottom:24px}
.hero-desc{font-size:16px;color:var(--muted);line-height:1.7;max-width:620px;margin-bottom:6px}
.hero-privacy{font-size:13px;color:#94a3b8;line-height:1.6;max-width:580px;margin-bottom:32px}

/* Executive summary card */
.exec-card{background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:12px;padding:24px 28px;max-width:720px}
.exec-card.mode-constraint{border-left-color:var(--amber)}
.exec-card.mode-progress{border-left-color:var(--green)}
.exec-card.mode-limited{border-left-color:#94a3b8}
.exec-card-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:10px;display:block}
.exec-card.mode-constraint .exec-card-label{color:var(--amber)}
.exec-card.mode-progress .exec-card-label{color:var(--green)}
.exec-card.mode-limited .exec-card-label{color:#94a3b8}
.exec-card-text{font-size:16px;color:var(--navy);line-height:1.7;font-weight:500}

/* Evidence strip */
.ev-strip{background:var(--bg);border-bottom:1px solid var(--border);padding:28px 40px}
.ev-strip-inner{max-width:960px;margin:0 auto}
.ev-strip-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:block}
.ev-strip-items{display:flex;gap:0;flex-wrap:wrap;align-items:stretch}
.ev-item{display:flex;flex-direction:column;gap:2px;padding:0 28px}
.ev-item:first-child{padding-left:0}
.ev-item-n{font-family:var(--fh);font-size:24px;font-weight:800;color:var(--navy);line-height:1.1}
.ev-item-label{font-size:12px;color:var(--muted);line-height:1.4;max-width:130px}
.ev-divider{width:1px;background:var(--border);flex-shrink:0;align-self:stretch}

/* Sections */
.section{padding:56px 40px;border-top:1px solid var(--border)}
.sec-white{background:var(--white)}
.sec-tinted{background:var(--bg)}
.section-inner{max-width:960px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:12px}
.eyebrow-amber{color:var(--amber)}
.section-title{font-family:var(--fh);font-size:clamp(18px,2.2vw,24px);font-weight:800;color:var(--navy);margin-bottom:8px;letter-spacing:-.01em;line-height:1.2}
.section-sub{font-size:14px;color:var(--muted);line-height:1.7;max-width:640px;margin-bottom:32px}

/* Outcome legend */
.outcome-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#475569}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* Area bars */
.area-rows{display:flex;flex-direction:column;gap:18px}
.area-row{display:grid;grid-template-columns:200px 1fr 64px;gap:12px;align-items:center}
.area-name{font-size:13px;font-weight:600;color:var(--navy);line-height:1.35}
.bar-track{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:1px;background:var(--border)}
.bar-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:0;overflow:hidden;padding:0 4px;white-space:nowrap;transition:width .4s}
.bar-seg.zero{display:none}
.area-count{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}

/* Exposure section */
.exposure-note{font-size:13px;color:var(--muted);font-style:italic;line-height:1.65;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.exposure-areas{display:flex;flex-direction:column;gap:24px}
.exp-area{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start;padding-bottom:20px;border-bottom:1px solid var(--bg)}
.exp-area:last-child{border-bottom:none;padding-bottom:0}
.exp-area-name{font-size:13px;font-weight:700;color:var(--navy);padding-top:4px;line-height:1.35}
.exp-stat{font-size:14px;color:var(--navy);line-height:1.6;margin-bottom:10px}
.exp-stat strong{font-weight:700}
.exp-bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;gap:1px;margin-bottom:6px}
.exp-bar-seg{height:100%;transition:width .4s}
.exp-denominator{font-size:11px;color:#94a3b8;line-height:1.5}
.exp-no-data{font-size:13px;color:#94a3b8;font-style:italic}

/* Intervention list */
.interv-list{display:flex;flex-direction:column}
.interv-item{padding:22px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 72px;gap:20px;align-items:start}
.interv-item:last-child{border-bottom:none}
.interv-item-label{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:8px;line-height:1.4}
.interv-item-areas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.interv-area-tag{font-size:12px;color:#475569;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;display:flex;align-items:center;gap:4px}
.interv-count{font-weight:700;color:var(--navy)}
.interv-item-note{font-size:13px;color:var(--muted);line-height:1.65}
.interv-total{text-align:right}
.interv-total-n{font-family:var(--fh);font-size:22px;font-weight:800;color:var(--navy);display:block;line-height:1.1}
.interv-total-label{font-size:11px;color:var(--muted)}

/* Perspectives */
.persp-block{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.persp-col-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.persp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.persp-area-item{padding:9px 0;border-bottom:1px solid var(--bg);font-size:14px;color:var(--navy);line-height:1.4}
.persp-area-item:last-child{border-bottom:none}
.persp-none{font-size:13px;color:#94a3b8;font-style:italic}
.persp-note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:28px;padding-top:24px;border-top:1px solid var(--border);font-style:italic}

/* Recommendations — centrepiece */
.section-rec{background:var(--white);padding:64px 40px;border-top:1px solid var(--border)}
.rec-generating{background:var(--bg);border:1.5px dashed var(--border);border-radius:12px;padding:32px;text-align:center}
.rec-generating-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:6px}
.rec-generating-sub{font-size:13px;color:var(--muted)}
.rec-list{display:flex;flex-direction:column;gap:24px}
.rec-card{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:12px;padding:32px 36px;overflow:hidden}
.rec-header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.rec-number{font-family:var(--fh);font-size:30px;font-weight:800;color:var(--amber);line-height:1;min-width:40px}
.rec-divider-line{flex:1;height:1px;background:var(--border)}
.rec-body{display:flex;flex-direction:column;gap:20px}
.rec-field-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.rec-field-text{font-size:14px;color:#475569;line-height:1.7}
.rec-field-todo .rec-field-label{color:var(--navy)}
.rec-field-todo .rec-field-text{font-size:16px;font-weight:600;color:var(--navy);line-height:1.6}

/* Progress */
.prog-rows{display:flex;flex-direction:column;gap:16px;margin-bottom:32px}
.prog-row{display:grid;grid-template-columns:200px 1fr 56px;gap:12px;align-items:center}
.prog-bar-track{display:flex;height:20px;border-radius:5px;overflow:hidden;gap:1px}
.prog-bar-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:0;overflow:hidden;padding:0 3px;white-space:nowrap}
.prog-bar-seg.zero{display:none}
.prog-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.prog-stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px 22px}
.prog-stat-n{font-family:var(--fh);font-size:30px;font-weight:800;color:var(--navy);line-height:1;margin-bottom:5px}
.prog-stat-label{font-size:12px;color:var(--muted);line-height:1.5}
.prog-proposed-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px}
.prog-proposed-pills{display:flex;gap:8px;flex-wrap:wrap}
.proposed-pill{background:#eff6ff;border:1px solid #bfdbfe;border-radius:20px;padding:4px 12px;font-size:12px;color:#1d4ed8;font-weight:600}
.prog-not-available{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:24px;font-size:14px;color:var(--muted);text-align:center}

/* Evidence quality */
.eq-note{font-size:14px;color:var(--muted);line-height:1.7;max-width:640px;margin-bottom:24px}
.eq-stats{display:flex;gap:24px;flex-wrap:wrap;align-items:center;padding-top:20px;border-top:1px solid var(--border)}
.eq-stat{display:flex;flex-direction:column;gap:2px}
.eq-stat-n{font-family:var(--fh);font-size:22px;font-weight:800;color:var(--navy);line-height:1.1}
.eq-stat-label{font-size:12px;color:var(--muted)}
.eq-bar-wrap{flex:1;min-width:160px}
.eq-bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.eq-bar-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .5s}
.eq-bar-label{font-size:11px;color:#94a3b8;margin-top:5px}

/* Threshold */
.threshold-inner{max-width:560px}
.threshold-title{font-family:var(--fh);font-size:18px;font-weight:700;color:var(--navy);margin-bottom:10px}
.threshold-body{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.threshold-bar-track{background:var(--border);border-radius:8px;height:8px;overflow:hidden;margin-bottom:10px}
.threshold-bar-fill{height:100%;background:var(--blue);border-radius:8px;transition:width .5s}
.threshold-label{font-size:13px;color:#94a3b8}

/* Footer close */
.footer-close{background:var(--bg);border-top:1px solid var(--border);padding:48px 40px;text-align:center}
.footer-close-inner{max-width:600px;margin:0 auto}
.footer-close-title{font-family:var(--fh);font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px}
.footer-close-text{font-size:14px;color:var(--muted);line-height:1.7}

/* Timestamp */
.timestamp{text-align:right;padding:10px 40px;font-size:11px;color:#94a3b8}

/* Footer */
footer{background:var(--bg);border-top:1px solid var(--border);padding:28px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.footer-brand{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--navy)}
.footer-brand span{color:var(--amber)}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.footer-links a{color:var(--muted);font-size:12px}
.footer-copy{font-size:11px;color:#94a3b8;width:100%;margin:0}

@media(max-width:900px){
  nav,footer,.footer-close{padding-left:20px;padding-right:20px}
  .hero,.ev-strip,.section,.section-rec{padding-left:20px;padding-right:20px}
  .area-row{grid-template-columns:130px 1fr 48px}
  .exp-area{grid-template-columns:1fr}
  .persp-block{grid-template-columns:1fr}
  .prog-row{grid-template-columns:130px 1fr 48px}
  .interv-item{grid-template-columns:1fr}
  .rec-card{padding:24px}
  .section-rec{padding-top:48px;padding-bottom:48px}
}
@media(max-width:580px){
  .area-row{grid-template-columns:110px 1fr}
  .area-count{display:none}
  .prog-row{grid-template-columns:110px 1fr}
  .ev-strip-items{gap:0;flex-direction:column}
  .ev-divider{width:100%;height:1px;margin:14px 0}
  .ev-item{padding:0}
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">Get Chartered <span>AI</span></a>
  <span class="nav-label">Employer Dashboard</span>
</nav>

<div id="app">
  <div class="state-wrap">
    <div class="spinner"></div>
    <p class="state-title">Loading overview&hellip;</p>
  </div>
</div>

<footer>
  <div class="footer-brand">Get Chartered <span>AI</span></div>
  <div class="footer-links">
    <a href="/employer">Employer</a>
    <a href="/employer-guide">Guide</a>
  </div>
  <p class="footer-copy">&copy; 2026 Get Chartered AI</p>
</footer>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────

const FIVE_AREAS = [
  'Professional Behaviour & Responsibility',
  'Communication & Working With Others',
  'Learning & Applying Knowledge',
  'Judgement, Help & Escalation',
  'Feedback, Reflection & Development'
];

const OUTCOME_KEYS = ['ON TRACK','DEVELOPING','SUPPORT WOULD HELP','NOT YET ENOUGH EXPOSURE'];
const OUTCOME_COLORS = {
  'ON TRACK':'#10b981','DEVELOPING':'#3b82f6',
  'SUPPORT WOULD HELP':'#f59e0b','NOT YET ENOUGH EXPOSURE':'#cbd5e1'
};
const OUTCOME_LABELS_SHORT = {
  'ON TRACK':'On track','DEVELOPING':'Developing',
  'SUPPORT WOULD HELP':'Support would help','NOT YET ENOUGH EXPOSURE':'Not yet enough exposure'
};

const PROGRESS_LABELS = ['Progress evident','Some progress','Limited evidence of progress','Priority should be reconsidered'];
const PROGRESS_COLORS = {
  'Progress evident':'#10b981','Some progress':'#3b82f6',
  'Limited evidence of progress':'#f59e0b','Priority should be reconsidered':'#ef4444'
};

// ── Polling ───────────────────────────────────────────────────────────────────

const POLL_DELAYS = [15000, 30000, 60000];
let _pollAttempt = 0;

function scheduleNextPoll() {
  if (_pollAttempt >= POLL_DELAYS.length) {
    const banner = document.getElementById('refresh-banner');
    if (banner) {
      banner.innerHTML = `<span>The overview is still being prepared.</span>
        <button onclick="manualRefresh()" style="margin-left:10px;background:none;border:1px solid #92400e;border-radius:5px;padding:3px 10px;font-size:12px;color:#92400e;cursor:pointer;font-family:inherit">Check again</button>`;
    }
    return;
  }
  const delay = POLL_DELAYS[_pollAttempt++];
  setTimeout(() => loadDashboard(true), delay);
}

function manualRefresh() { _pollAttempt = 0; loadDashboard(true); }

// ── Token ─────────────────────────────────────────────────────────────────────

function readToken() {
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');
  if (urlToken) {
    localStorage.setItem('gca_employer_token', urlToken);
    const url = new URL(window.location);
    url.searchParams.delete('token');
    window.history.replaceState({}, '', url.toString());
    return urlToken;
  }
  return localStorage.getItem('gca_employer_token');
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function pct(n, d) { return d > 0 ? Math.round(n / d * 100) : 0; }
function pctStr(n, d) { return d > 0 ? pct(n, d) + '%' : '—'; }
function e(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function shortArea(name) {
  return {
    'Professional Behaviour & Responsibility': 'Professional Behaviour',
    'Communication & Working With Others': 'Communication',
    'Learning & Applying Knowledge': 'Learning & Applying Knowledge',
    'Judgement, Help & Escalation': 'Judgement, Help & Escalation',
    'Feedback, Reflection & Development': 'Feedback & Reflection'
  }[name] || name;
}

// ── Executive summary (spec §23) ─────────────────────────────────────────────
// Deterministic — does not depend on AI response.
// Four modes: constraint-led / progress-led / mixed / evidence-limited

function deriveExecutiveSummary(coverage, stateA, stateB) {
  if (!stateA || !stateA.available) {
    return { mode: 'evidence-limited', text: 'The current evidence is not yet strong enough to identify a reliable pattern across your graduates and apprentices.' };
  }

  // Progress-led via State B: broad progress evident at Phase 4
  if (stateB && stateB.available) {
    let ev = 0, tot = 0;
    for (const area of FIVE_AREAS) {
      const p = stateB.progressJudgements.byArea[area];
      if (p && p.total > 0) { ev += p['Progress evident'] || 0; tot += p.total; }
    }
    if (tot >= 5 && ev / tot >= 0.5) {
      return { mode: 'progress-led', text: 'Your graduates and apprentices are showing progress across most active priorities, with the clearest opportunity now being greater stretch and responsibility.' };
    }
  }

  // Constraint-led: exposure gaps dominate across at least one area
  const constrained = FIVE_AREAS.filter(area => {
    const d = stateA.exposureIntelligence && stateA.exposureIntelligence.byArea && stateA.exposureIntelligence.byArea[area];
    return d && d.denominator >= 3 && d.confirmedLack > d.relevantExposure && d.confirmedLack > 1;
  });
  if (constrained.length >= 1) {
    const named = constrained.slice(0, 2);
    const areaStr = named.length === 1 ? named[0] : named[0] + ' and ' + named[1];
    return { mode: 'constraint-led', text: 'Workplace exposure appears to be the strongest current development constraint in this group, particularly in' + areaStr + '.' };
  }

  // Progress-led at Benchmark: majority on track
  let onTrack = 0, total = 0;
  for (const area of FIVE_AREAS) {
    const c = stateA.areaOutcomes && stateA.areaOutcomes.byArea && stateA.areaOutcomes.byArea[area];
    if (c) { onTrack += c['ON TRACK'] || 0; total += c.total || 0; }
  }
  if (total >= 5 && onTrack / total >= 0.5) {
    return { mode: 'progress-led', text: 'Development is progressing well across most areas in this group. The majority of participants show evidence of readiness across the five professional readiness areas.' };
  }

  // Mixed
  return { mode: 'mixed', text: 'Development is uneven across the group: progress is evident in some areas, while development priorities and exposure gaps remain active in others.' };
}

function countAreasWithEvidence(stateA) {
  if (!stateA || !stateA.available) return 0;
  return FIVE_AREAS.filter(area => (stateA.areaOutcomes && stateA.areaOutcomes.byArea && stateA.areaOutcomes.byArea[area] && stateA.areaOutcomes.byArea[area].total >= 5)).length;
}

// ── Error / loading states ────────────────────────────────────────────────────

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="state-wrap">
      <p class="state-title">Unable to load dashboard</p>
      <p class="state-body">${e(msg)}</p>
      <a class="state-link" href="mailto:support@getcharteredai.com">Contact support</a>
    </div>`;
}

function renderNoToken() {
  document.getElementById('app').innerHTML = `
    <div class="state-wrap">
      <p class="state-title">Access link required</p>
      <p class="state-body">Please use the access link sent to your email address to view your Professional Readiness Overview.</p>
      <a class="state-link" href="mailto:support@getcharteredai.com">Request a new access link</a>
    </div>`;
}

function renderComputingOnly(firmName) {
  document.getElementById('app').innerHTML = `
    <div class="state-wrap">
      <div class="spinner"></div>
      <p class="state-title">Preparing your overview</p>
      <p class="state-body">Michael is analysing the Professional Readiness data for ${e(firmName || 'your group')}. This usually takes under a minute. The page will refresh automatically.</p>
    </div>`;
}

// ── Section renderers ─────────────────────────────────────────────────────────

function renderHero(coverage, stateA, stateB, firmName, computing) {
  const summary = deriveExecutiveSummary(coverage, stateA, stateB);
  const modeClass = {
    'constraint-led': 'mode-constraint',
    'progress-led': 'mode-progress',
    'evidence-limited': 'mode-limited',
    'mixed': 'mode-mixed'
  }[summary.mode] || '';
  return `
  <div class="hero">
    <div class="hero-inner">
      <span class="hero-eyebrow">Employer Dashboard</span>
      <h1 class="hero-title">Professional Readiness Overview</h1>
      ${firmName ? `<p class="hero-firm">${e(firmName)}</p>` : ''}
      <p class="hero-desc">A pattern-level view of where your graduates and apprentices are progressing, where development may be constrained, and what to consider next.</p>
      <p class="hero-privacy">This dashboard shows cohort patterns, not individual results. Individual reflections remain with the participant and their manager.</p>
      <div class="exec-card ${modeClass}">
        <span class="exec-card-label">What the current evidence suggests</span>
        <p class="exec-card-text">${e(summary.text)}</p>
      </div>
    </div>
  </div>
  ${computing ? `<div id="refresh-banner" class="refresh-banner"><span class="refresh-dot"></span>&ensp;Refreshing overview &mdash; existing view shown below.</div>` : ''}`;
}

function renderEvidenceStrip(coverage, stateA, stateB) {
  const areasCount = countAreasWithEvidence(stateA);
  const mp = stateA && stateA.available ? stateA.managerParticipation : null;
  const items = [
    { n: coverage.total, label: 'Total participants' },
    { n: coverage.analyticsEligible, label: 'Analytics eligible' },
    mp && mp.coverage.basedOn > 0 ? { n: mp.participated, label: 'of ' + mp.coverage.basedOn + ' eligible with manager perspective' } : null,
    stateB && stateB.available ? { n: stateB.basedOn, label: 'with Progress Reflection' } : null,
    stateA && stateA.available ? { n: areasCount, label: 'of 5 areas with sufficient evidence' } : null
  ].filter(Boolean);

  return `
  <div class="ev-strip">
    <div class="ev-strip-inner">
      <span class="ev-strip-label">Who this insight represents</span>
      <div class="ev-strip-items">
        ${items.map((item, i) => `${i > 0 ? '<div class="ev-divider"></div>' : ''}
          <div class="ev-item">
            <span class="ev-item-n">${item.n}</span>
            <span class="ev-item-label">${e(item.label)}</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderReadinessSection(stateA) {
  const { byArea, coverage } = stateA.areaOutcomes;
  const legendHtml = OUTCOME_KEYS.map(k => `
    <div class="leg-item">
      <span class="leg-dot" style="background:${OUTCOME_COLORS[k]}"></span>
      <span>${e(OUTCOME_LABELS_SHORT[k])}</span>
    </div>`).join('');
  const rowsHtml = FIVE_AREAS.map(area => {
    const c = byArea[area];
    if (!c || c.total === 0) return '';
    return `<div class="area-row">
      <span class="area-name">${e(shortArea(area))}</span>
      <div class="bar-track">
        ${OUTCOME_KEYS.map(k => {
          const n = c[k] || 0;
          const w = c.total > 0 ? Math.round(n / c.total * 100) : 0;
          return `<div class="bar-seg${n === 0 ? ' zero' : ''}" style="width:${w}%;background:${OUTCOME_COLORS[k]}" title="${OUTCOME_LABELS_SHORT[k]}: ${n}">${w >= 14 ? pctStr(n, c.total) : ''}</div>`;
        }).join('')}
      </div>
      <span class="area-count">${c.total}</span>
    </div>`;
  }).join('');
  return `
  <div class="section sec-white">
    <div class="section-inner">
      <span class="eyebrow">Professional Readiness</span>
      <h2 class="section-title">Where your graduates and apprentices are developing well &mdash; and where support is needed</h2>
      <p class="section-sub">Outcome distribution across the five Professional Readiness areas. Based on ${coverage.basedOn} of ${coverage.total} analytics-eligible sessions with Benchmark data.</p>
      <div class="outcome-legend">${legendHtml}</div>
      <div class="area-rows">${rowsHtml}</div>
    </div>
  </div>`;
}

function renderExposureSection(stateA) {
  const { byArea, coverage } = stateA.exposureIntelligence;
  const areasHtml = FIVE_AREAS.map(area => {
    const d = byArea[area];
    if (!d || d.denominator === 0) {
      return `<div class="exp-area">
        <div class="exp-area-name">${e(shortArea(area))}</div>
        <div><p class="exp-no-data">No exposure data available for this area.</p></div>
      </div>`;
    }
    const lackPct = Math.round(d.confirmedLack / d.denominator * 100);
    const relPct = Math.round(d.relevantExposure / d.denominator * 100);
    const nasPct = 100 - lackPct - relPct;
    const statText = d.confirmedLack === 0
      ? '<strong>No confirmed exposure gaps</strong> in this area (' + d.denominator + ' with exposure data).'
      : '<strong>' + d.confirmedLack + ' of ' + d.denominator + '</strong> participants report limited opportunity to practise in this area. ' + d.relevantExposure + ' report relevant workplace exposure.';
    return `<div class="exp-area">
      <div class="exp-area-name">${e(shortArea(area))}</div>
      <div>
        <p class="exp-stat">${statText}</p>
        <div class="exp-bar-track">
          <div class="exp-bar-seg" style="width:${lackPct}%;background:#f59e0b" title="Confirmed lack: ${d.confirmedLack}"></div>
          <div class="exp-bar-seg" style="width:${relPct}%;background:#10b981" title="Relevant exposure: ${d.relevantExposure}"></div>
          <div class="exp-bar-seg" style="width:${Math.max(0, nasPct)}%;background:#cbd5e1" title="Not assessed: ${d.notAssessed}"></div>
        </div>
        <p class="exp-denominator">${d.confirmedLack} lack exposure &middot; ${d.relevantExposure} have relevant exposure &middot; ${d.notAssessed} not assessed${d.unavailable > 0 ? ' &middot; ' + d.unavailable + ' without data (excluded from base)' : ''}</p>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="section sec-tinted">
    <div class="section-inner">
      <span class="eyebrow">Exposure Intelligence</span>
      <h2 class="section-title">Where people may not be getting the experience they need</h2>
      <p class="section-sub">This shows where participants are getting the opportunity to practise key professional behaviours &mdash; and where that opportunity may be limited.</p>
      <p class="exposure-note">A lack of opportunity is not a capability judgement.</p>
      <div class="exposure-areas">${areasHtml}</div>
    </div>
  </div>`;
}

function renderInterventionSection(stateA) {
  const { byArea } = stateA.interventionTypes;
  const defs = [
    { key: 'experienceExposureNeed', label: 'Create more workplace exposure', note: 'Participants are reporting limited opportunity to practise. This is an organisational condition, not a personal capability issue.' },
    { key: 'learningPracticeNeed', label: 'Build capability through learning and practice', note: 'Participants may benefit from structured learning or rehearsal before applying further in live work.' },
    { key: 'priorityAlignmentConversation', label: 'Clarify development priorities', note: 'Different development priorities are being identified across sources. A focused conversation may help align on what to focus on next.' },
    { key: 'insufficientEvidence', label: 'Strengthen evidence before acting', note: 'Evidence in this area is limited at this stage. More structured engagement would give a clearer picture before any action is taken.' }
  ];
  const items = defs.map(def => {
    const areaList = FIVE_AREAS
      .map(area => ({ area, count: byArea[area] && byArea[area][def.key] || 0 }))
      .filter(x => x.count > 0)
      .sort((a, b) => b.count - a.count)
      .slice(0, 4);
    if (areaList.length === 0) return null;
    return { ...def, areaList, total: areaList.reduce((s, x) => s + x.count, 0) };
  }).filter(Boolean);
  if (items.length === 0) return '';
  return `
  <div class="section sec-white">
    <div class="section-inner">
      <span class="eyebrow">Development Needs</span>
      <h2 class="section-title">What kind of support appears to be needed</h2>
      <p class="section-sub">The most common type of development need across the cohort. Different needs require different responses.</p>
      <div class="interv-list">
        ${items.map(item => `
          <div class="interv-item">
            <div>
              <div class="interv-item-label">${e(item.label)}</div>
              <div class="interv-item-areas">
                ${item.areaList.map(x => `<span class="interv-area-tag">${e(shortArea(x.area))} <span class="interv-count">${x.count}</span></span>`).join('')}
              </div>
              <p class="interv-item-note">${e(item.note)}</p>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderPerspectivesSection(stateA) {
  const { perspectives } = stateA;
  const sources = [
    (perspectives.candidateSelectedPriority && perspectives.candidateSelectedPriority.byArea) || {},
    (perspectives.managerSelectedFocusAreas && perspectives.managerSelectedFocusAreas.byArea) || {},
    (perspectives.michaelBenchmarkPriorities && perspectives.michaelBenchmarkPriorities.byArea) || {},
    (perspectives.michaelSynthesisPriorities && perspectives.michaelSynthesisPriorities.byArea) || {}
  ];
  const areaData = FIVE_AREAS.map(area => {
    const mentions = sources.filter(src => (src[area] || 0) > 0).length;
    const total = sources.reduce((s, src) => s + (src[area] || 0), 0);
    return { area, mentions, total };
  }).filter(x => x.total > 0);
  const aligned = areaData.filter(x => x.mentions >= 3).sort((a, b) => b.mentions - a.mentions || b.total - a.total);
  const divergent = areaData.filter(x => x.mentions <= 2 && x.total >= 2).sort((a, b) => b.total - a.total).slice(0, 3);
  if (aligned.length === 0 && divergent.length === 0) return '';
  return `
  <div class="section sec-tinted">
    <div class="section-inner">
      <span class="eyebrow">Perspective Patterns</span>
      <h2 class="section-title">Where development signals align &mdash; or differ</h2>
      <p class="section-sub">How candidate, manager and Michael perspectives point across the five areas. Alignment suggests shared recognition. Difference is not inherently a problem &mdash; it often indicates where a conversation would be useful.</p>
      <div class="persp-block">
        <div>
          <div class="persp-col-title"><span class="persp-dot" style="background:var(--blue)"></span>Strongest alignment</div>
          ${aligned.length === 0
            ? `<p class="persp-none">No area is consistently identified by multiple sources at this stage.</p>`
            : aligned.map(x => `<div class="persp-area-item">${e(shortArea(x.area))}</div>`).join('')}
        </div>
        <div>
          <div class="persp-col-title"><span class="persp-dot" style="background:var(--amber)"></span>Different priorities being identified</div>
          ${divergent.length === 0
            ? `<p class="persp-none">No significant divergence in priorities at this stage.</p>`
            : divergent.map(x => `<div class="persp-area-item">${e(shortArea(x.area))}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function renderRecommendationsSection(stateA) {
  const actions = stateA.employerActions && stateA.employerActions.actions;
  const heading = `
    <span class="eyebrow eyebrow-amber">Development Conditions</span>
    <h2 class="section-title">What this suggests you do next</h2>`;
  if (!actions) {
    return `<div class="section-rec"><div class="section-inner">${heading}
      <div class="rec-generating">
        <p class="rec-generating-title">Preparing your recommendations</p>
        <p class="rec-generating-sub">Michael is reviewing the cohort patterns and identifying the most useful actions to consider next.</p>
      </div></div></div>`;
  }
  if (actions.length === 0) {
    return `<div class="section-rec"><div class="section-inner">${heading}
      <p class="section-sub">No development conditions are available at this stage. The evidence may not yet be strong enough to support a clear recommendation.</p>
      </div></div>`;
  }
  const cardsHtml = actions.map((a, i) => {
    const num = String(i + 1).padStart(2, '0');
    // New four-part format
    if (a.seeing || a.toDo) {
      return `<div class="rec-card">
        <div class="rec-header"><span class="rec-number">${num}</span><div class="rec-divider-line"></div></div>
        <div class="rec-body">
          ${a.seeing ? `<div><span class="rec-field-label">What we&rsquo;re seeing</span><p class="rec-field-text">${e(a.seeing)}</p></div>` : ''}
          ${a.means ? `<div><span class="rec-field-label">What this may mean</span><p class="rec-field-text">${e(a.means)}</p></div>` : ''}
          ${a.toDo ? `<div class="rec-field-todo"><span class="rec-field-label">What to do next</span><p class="rec-field-text">${e(a.toDo)}</p></div>` : ''}
          ${a.review ? `<div><span class="rec-field-label">Review</span><p class="rec-field-text">${e(a.review)}</p></div>` : ''}
        </div>
      </div>`;
    }
    // Legacy format { action, basis }
    return `<div class="rec-card">
      <div class="rec-header"><span class="rec-number">${num}</span><div class="rec-divider-line"></div></div>
      <div class="rec-body">
        ${a.action ? `<div class="rec-field-todo"><span class="rec-field-label">What to do next</span><p class="rec-field-text">${e(a.action)}</p></div>` : ''}
        ${a.basis ? `<div><span class="rec-field-label">Evidence basis</span><p class="rec-field-text">${e(a.basis)}</p></div>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="section-rec">
    <div class="section-inner">${heading}
      <p class="section-sub">Evidence-based conditions the organisation can create to support professional development. Each condition derives from structured cohort evidence.</p>
      <div class="rec-list">${cardsHtml}</div>
    </div>
  </div>`;
}

function renderProgressSection(stateB) {
  const notAvail = `
  <div class="section sec-tinted">
    <div class="section-inner">
      <span class="eyebrow">Progress Movement</span>
      <h2 class="section-title">What is changing over time</h2>
      <div class="prog-not-available">Progress insight will appear once at least 5 participants have completed their Progress Reflection.</div>
    </div>
  </div>`;
  if (!stateB || !stateB.available) return notAvail;
  const { progressJudgements, graduationRate, progressManagerParticipation, proposedPriorityAreas, basedOn } = stateB;
  const legendHtml = PROGRESS_LABELS.map(lbl => `
    <div class="leg-item"><span class="leg-dot" style="background:${PROGRESS_COLORS[lbl]}"></span><span>${e(lbl)}</span></div>`).join('');
  const rowsHtml = FIVE_AREAS.map(area => {
    const p = progressJudgements.byArea[area];
    if (!p || p.total === 0) return '';
    return `<div class="prog-row">
      <span class="area-name">${e(shortArea(area))}</span>
      <div class="prog-bar-track">
        ${PROGRESS_LABELS.map(lbl => {
          const n = p[lbl] || 0;
          const w = p.total > 0 ? Math.round(n / p.total * 100) : 0;
          return `<div class="prog-bar-seg${n === 0 ? ' zero' : ''}" style="width:${w}%;background:${PROGRESS_COLORS[lbl]}" title="${lbl}: ${n}">${w >= 16 ? pctStr(n, p.total) : ''}</div>`;
        }).join('')}
      </div>
      <span class="area-count">${p.total}</span>
    </div>`;
  }).join('');
  const gradPct = graduationRate.total > 0 ? pct(graduationRate.graduated, graduationRate.total) : 0;
  const mgrPct = progressManagerParticipation.total > 0 ? pct(progressManagerParticipation.participated, progressManagerParticipation.total) : 0;
  const proposed = proposedPriorityAreas || [];
  return `
  <div class="section sec-tinted">
    <div class="section-inner">
      <span class="eyebrow">Progress Movement</span>
      <h2 class="section-title">What is changing over time</h2>
      <p class="section-sub">Based on ${basedOn} participants who completed the Phase 4 progress review.</p>
      <div class="outcome-legend">${legendHtml}</div>
      <div class="prog-rows">${rowsHtml}</div>
      <div class="prog-stats">
        <div class="prog-stat">
          <div class="prog-stat-n">${gradPct}%</div>
          <div class="prog-stat-label">of priority slots graduated &mdash; ${graduationRate.graduated} of ${graduationRate.total} priorities resolved</div>
        </div>
        <div class="prog-stat">
          <div class="prog-stat-n">${mgrPct}%</div>
          <div class="prog-stat-label">manager participation in progress review &mdash; ${progressManagerParticipation.participated} of ${progressManagerParticipation.total} sessions</div>
        </div>
      </div>
      ${proposed.length > 0 ? `
        <div>
          <p class="prog-proposed-title">Proposed next priority areas</p>
          <div class="prog-proposed-pills">
            ${proposed.map(p2 => `<span class="proposed-pill">${e(shortArea(p2.label))} &times;${p2.count}</span>`).join('')}
          </div>
        </div>` : ''}
    </div>
  </div>`;
}

function renderEvidenceQualitySection(stateA, coverage, stateB) {
  if (!stateA || !stateA.available) return '';
  const { managerParticipation } = stateA;
  const mgrParticipated = managerParticipation.participated;
  const mgrBasedOn = managerParticipation.coverage.basedOn;
  const mgrPct = mgrBasedOn > 0 ? pct(mgrParticipated, mgrBasedOn) : 0;
  const ph4Count = stateB && stateB.available ? stateB.basedOn : (coverage.phase4Complete || 0);
  const total = coverage.analyticsEligible;

  const note = mgrParticipated < mgrBasedOn
    ? 'Manager perspective is available for part of this group. Where it is absent, findings rely on participant-reported evidence only — interpret those areas with more caution.'
    : 'Manager perspective is available across the full group. Findings benefit from both participant-reported and externally observed workplace evidence.';

  return `
  <div class="section sec-white">
    <div class="section-inner">
      <span class="eyebrow">Evidence Quality</span>
      <h2 class="section-title">How strong is this view?</h2>
      <p class="eq-note">${e(note)}</p>
      <div class="eq-stats">
        <div class="eq-stat">
          <span class="eq-stat-n">${total}</span>
          <span class="eq-stat-label">participants completed the Benchmark</span>
        </div>
        <div class="eq-stat">
          <span class="eq-stat-n">${mgrParticipated}</span>
          <span class="eq-stat-label">of ${mgrBasedOn} with manager perspective</span>
        </div>
        <div class="eq-stat">
          <span class="eq-stat-n">${ph4Count}</span>
          <span class="eq-stat-label">${ph4Count >= 5 ? 'with Progress Reflection data' : 'with Progress Reflection — below threshold for cohort patterns'}</span>
        </div>
      </div>
      <div class="eq-bar-wrap">
        <div class="eq-bar-track"><div class="eq-bar-fill" style="width:${mgrPct}%"></div></div>
        <div class="eq-bar-label">${mgrPct}% manager participation rate</div>
      </div>
    </div>
  </div>`;
}

function renderThresholdSections(coverage) {
  const needed = Math.max(0, 5 - coverage.analyticsEligible);
  const barW = Math.min(100, Math.round(coverage.analyticsEligible / 5 * 100));
  return `
  <div class="section sec-white">
    <div class="section-inner">
      <div class="threshold-inner">
        <h3 class="threshold-title">Cohort insights will appear soon</h3>
        <p class="threshold-body">Aggregated readiness insights are available once at least 5 participants reach the Benchmark stage. This protects the privacy of individual responses.</p>
        <div class="threshold-bar-track"><div class="threshold-bar-fill" style="width:${barW}%"></div></div>
        <p class="threshold-label">${coverage.analyticsEligible} of 5 needed${needed > 0 ? ' — ' + needed + ' more to unlock' : ''}</p>
      </div>
    </div>
  </div>`;
}

function renderFooterClose() {
  return `
  <div class="footer-close">
    <div class="footer-close-inner">
      <p class="footer-close-title">Professional readiness is developed over time.</p>
      <p class="footer-close-text">Revisit this dashboard after the next Progress Reflection to see which patterns are changing and where new priorities are emerging.</p>
    </div>
  </div>`;
}

// ── Main render ───────────────────────────────────────────────────────────────

function renderDashboard(apiResponse) {
  const { snapshot, computing, firmName } = apiResponse;
  const app = document.getElementById('app');

  if (!snapshot && computing) {
    renderComputingOnly(firmName);
    scheduleNextPoll();
    return;
  }
  if (!snapshot) {
    renderError('No data is available yet. Please check back once participants have begun.');
    return;
  }

  const { coverage, stateA, stateB } = snapshot;
  const computedAt = snapshot.computedAt
    ? new Date(snapshot.computedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
    : null;

  let html = '';
  html += renderHero(coverage, stateA, stateB, firmName, computing);
  html += renderEvidenceStrip(coverage, stateA, stateB);

  if (!stateA.available) {
    html += renderThresholdSections(coverage);
  } else {
    html += renderReadinessSection(stateA);
    html += renderExposureSection(stateA);
    html += renderInterventionSection(stateA);
    html += renderPerspectivesSection(stateA);
    html += renderRecommendationsSection(stateA);
    html += renderProgressSection(stateB || { available: false });
    html += renderEvidenceQualitySection(stateA, coverage, stateB);
  }

  html += renderFooterClose();
  if (computedAt) html += `<div class="timestamp">Last updated: ${e(computedAt)}</div>`;

  app.innerHTML = html;
  if (computing) scheduleNextPoll();
}

// ── Load ──────────────────────────────────────────────────────────────────────

async function loadDashboard(silent) {
  const token = readToken();
  if (!token) { renderNoToken(); return; }

  if (!silent) _pollAttempt = 0;

  if (!silent) {
    document.getElementById('app').innerHTML = `
      <div class="state-wrap">
        <div class="spinner"></div>
        <p class="state-title">Loading overview&hellip;</p>
      </div>`;
  }

  try {
    const res = await fetch('/.netlify/functions/p1-cohort-snapshot-load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });

    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('gca_employer_token');
      renderError('This access link has expired or is not valid. Please contact support@getcharteredai.com to request a new one.');
      return;
    }
    if (res.status === 404) {
      renderError('Professional Readiness Overview not found. Please contact support@getcharteredai.com.');
      return;
    }
    if (!res.ok) {
      renderError('Could not load the overview. Please try again in a few minutes.');
      return;
    }

    const data = await res.json();
    renderDashboard(data);

  } catch {
    renderError('Could not connect. Please check your connection and try again.');
  }
}

document.addEventListener('DOMContentLoaded', () => loadDashboard(false));
</script>
